<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>交集选择器</title>
	<style>
		.rich {
			color: red;
		}
		.beauty {
			color: blue;
		}
		p.beauty {
			font-size: 40px;
			color: green;
		}
		/* 上面是交集选择器  即 与 */
	</style>
</head>
<body>
	<h2 class="rich">张三</h2>
	<h2 class="beauty">李四</h2>
	<hr>
	<p class="beauty" id="wc">旺财</p>
	<p class="beauty">佩奇</p>
</body>
</html>
