<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width, initial-scale=1.0">
	<title>后代选择器</title>
	<style>
		ol li {
			color: red;
		}
		ul li {
			color: blue;
		}
		ol li a {
			color: green;
		}
		/*上面就是后代选择器  即 空格*/
	</style>
</head>
<body>
	<ol>
		<li>张三</li>
		<li>李四</li>
		<li>王五</li>
		<li>
			<a href="#">测试</a>
		</li>
	</ol>
	<hr>
	<ul>
		<li>抽烟</li>
		<li>喝酒</li>
		<li>烫头</li>

	</ul>
</body>
</html>
