<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>兄弟选择器</title>
</head>
<style>
	div + p {
		color: red;
	}
	p + p {
		color: blue;
	}
	h1 ~ p {
		color: green;
	}
</style>
<body>
	+ (相邻兄弟选择器)兄弟是向下寻找的仅仅相邻的, 如果不是紧紧相邻的, 就不会被选中
	~ (通用兄弟选择器)兄弟是下方所有的兄弟都会被选中
	<div>title</div>
	<p>1</p>
	<p>2</p>
	<p>3</p>
	<p>4</p>
	<p>5</p>
	<h1>theme1</h1>
	<div>test</div>
	<p>1</p>
	<p>2</p>
	<p>3</p>
</body>
</html>
