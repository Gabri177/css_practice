<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>交集选择器</title>
	<style>
		.rich {
			color: red;
			
		}
		.beauty {
			color: blue;
		}
		.dog {
			color: pink;
		}
		.pig {
			color: green;
		}

		.rich, 
		.beauty, 
		.dog, 
		.pig {
			background-color: gray;
			width: 100px;
		}
		/*上面就是并集算择器  即 或*/
	</style>
</head>
<body>
	<h2 class="rich">张三</h2>
	<h2 class="beauty">李四</h2>
	<hr>
	<p class="dog" id="wc">旺财</p>
	<p class="pig">佩奇</p>
</body>
</html>
