	<title>子代选择器</title>

	div > a {
		color: red;
	}
	
</style>
<body>
	<div>
		<a href="#">1</a>
		<a href="#">2</a>

		<p>
			<a href="#">4</a>
		</p>
	</div>
</body>
</html>
