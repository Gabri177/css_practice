<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>伪类选择器_否定伪类</title>
</head>
<style>
	div>p:not(.fail) {
		color: red;
	}
</style>
<body>
	<div>
		<p>1</p>
		<p>2</p>
		<p>3</p>
		<p>4</p>
		<p class="fail">5</p>
		<p class="fail">6</p>
	</div>
</body>
</html>
