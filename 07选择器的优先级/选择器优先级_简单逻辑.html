<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>选择器优先级_简单逻辑</title>
</head>
<style>
	/* 行内样式 > ID选择器 > 类选择器 > 元素选择器 > 通配选择器 */
	h1{
		color: red;
	}

	*{
		color: blue;
	}

	#test2{
		color: pink;
	}

	.test1{
		color: green;
	}

	h2{
		color: yellow;
	}
</style>
<body>
	<h1>jajajaja</h1>
	<h2 class="test1">kkkkkkk</h2>
	<h3 id="test2" class="test1">lllllllll</h3>
</body>
</html>
