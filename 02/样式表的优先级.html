<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>优先级</title>
	<link rel="stylesheet" href="./index.css">
	<style>
		h1 {
			color: red;
		}
	</style>
</head>
<body>
	<h1 style="color: rebeccapurple;">home</h1>
	<p>可以看出来行内样式的优先级高于内部样式</p>
	<p>内部样式和外部样式优先级相同 后来的样式会覆盖前面的样式</p>
</body>
</html>
