<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>类选择器</title>
	<style>

		* {
			color: black;
			font-size: 40px;
		}

		h1	{
			color: blue;
		}
		
		.theme1 {
			color: red;
		}

		.big {
			font-size: 60px;
		}
		/* 选择所有元素 */
	</style>
</head>
<body>
	<h1 class="theme1">h1-1</h1>
	<h1 class="theme2">h1-2</h1>
	<h1 class="theme3 big">h1-3</h1>
	<h2>h2</h2>
	<h3>h3</h3>
	<h4 class="theme1">h4</h4>
</body>
</html>
